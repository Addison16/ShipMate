name: Release image
# Publishes ghcr.io/<owner>/shipmate.
#   push to main  -> :edge and :sha-<short>
#   tag v1.2.3    -> :1.2.3, :1.2, :1 and :latest (pre-releases like v1.3.0-rc.1 skip :latest)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag is the release version: stamp it into the code so the image, /healthz and the
      # Health page's update check all report it, whatever version.ts says on main.
      - name: Stamp the tag version into the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not a version like v1.2.3 or v1.3.0-rc.1"
            exit 1
          fi
          sed -i "s/SHIPMATE_VERSION = \".*\"/SHIPMATE_VERSION = \"$version\"/" packages/core/src/version.ts
          grep -q "SHIPMATE_VERSION = \"$version\"" packages/core/src/version.ts
          echo "Building Shipmate $version"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shipmate
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Shipmate
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
