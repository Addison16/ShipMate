<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shipmate</title>
    <meta name="description" content="A self-hosted crew of AI agents, captained from one Bridge." />
    <meta name="theme-color" content="#0f766e" />
    <meta name="application-name" content="Shipmate" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shipmate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved appearance before the first paint (see src/lib/theme.ts).
      (() => {
        try {
          const p = JSON.parse(localStorage.getItem("shipmate-appearance") || "{}");
          const root = document.documentElement;
          const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
          if (p.themeMode === "dark" || (p.themeMode !== "light" && systemDark)) {
            root.classList.add("dark");
          }
          const themes = ["harbor", "open-sea", "coral-reef", "lighthouse", "kelp-forest", "admiral"];
          if (themes.includes(p.colorTheme)) {
            root.dataset.colorTheme = p.colorTheme;
            // Match the saved app's icon and manifest to the color theme (see appIconLinks).
            const dir = `/icons/${p.colorTheme}`;
            const links = {
              'link[rel="manifest"]': `${dir}/manifest.webmanifest`,
              'link[rel="icon"][type="image/svg+xml"]': `${dir}/icon.svg`,
              'link[rel="icon"][type="image/png"]': `${dir}/favicon-32.png`,
              'link[rel="apple-touch-icon"]': `${dir}/apple-touch-icon.png`,
            };
            for (const s in links) document.querySelector(s)?.setAttribute("href", links[s]);
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
