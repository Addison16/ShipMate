services:
  shipmate:
    image: ghcr.io/addison16/shipmate:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      SHIPMATE_URL: ${SHIPMATE_URL:-http://localhost:3000}
      # The `db` service below. Without DATABASE_URL (and `db`), Shipmate uses the database
      # built into its image instead, in the data volume; see docs/configuration.md.
      DATABASE_URL: postgres://shipmate:${POSTGRES_PASSWORD:-shipmate}@db:5432/shipmate
      # Leave unset to generate once on first boot (kept in the data volume).
      SHIPMATE_SECRET: ${SHIPMATE_SECRET:-}
      # Where to look for Ollama (the optional service below, or one you run elsewhere).
      SHIPMATE_OLLAMA_URL: ${SHIPMATE_OLLAMA_URL:-http://ollama:11434}
      # Reverse proxies to believe about https and the browser's address (docs/reverse-proxy.md).
      SHIPMATE_TRUST_PROXY: ${SHIPMATE_TRUST_PROXY:-loopback,linklocal,uniquelocal}
    volumes:
      - shipmate-data:/data
      # Sandboxes for the Shipyard run as sibling containers through the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shipmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipmate}
      POSTGRES_DB: shipmate
    volumes:
      - shipmate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipmate -d shipmate"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional local voice: Whisper speech-to-text and Kokoro text-to-speech behind an
  # OpenAI-compatible API (speaches). Off unless started with `--profile voice`; then choose
  # "A speech server" at http://voice:8000/v1 in Settings → Voice. See docs/phone.md.
  voice:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["voice"]
    environment:
      # Downloaded once into the volume on first start (about 1 GB together).
      PRELOAD_MODELS: '["Systran/faster-distil-whisper-small.en","speaches-ai/Kokoro-82M-v1.0-ONNX"]'
    volumes:
      - shipmate-voice:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  # Optional local models, off by default. Start with:
  #   docker compose --profile local-ai up -d
  # then pick the model in Shipmate (first-run setup, or Providers → Local model).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # NVIDIA GPU (needs the NVIDIA Container Toolkit on the host): uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Downloads one starter model into the ollama service once, then exits.
  # Choose another with SHIPMATE_LOCAL_MODEL (e.g. qwen3:8b); see docs/local-models.md.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${SHIPMATE_LOCAL_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  shipmate-data:
  shipmate-db:
  shipmate-voice:
  ollama-models:
